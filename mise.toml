[tools]
go = "1.25"

[env]
_.file = ".env"

[tasks.test-db-up]
run = "docker compose up -d postgres_test"
env = { TEST_DATABASE_URL = "postgres://saldo_test:saldo_test@localhost:5433/saldo_test?sslmode=disable" }

[tasks.test-db-wait]
depends = ["test-db-up"]
run = "until docker compose exec -T postgres_test pg_isready -U saldo_test -d saldo_test; do sleep 1; done"

[tasks.test-db-migrate]
depends = ["test-db-wait"]
run = "docker compose exec -T postgres_test psql -v ON_ERROR_STOP=1 -U saldo_test -d saldo_test < migrations/001_create_transactions.sql"

[tasks.test-integration]
depends = ["test-db-up", "test-db-migrate"]
run = "go test -tags=integration ./..."

[tasks.ci]
depends = [
  "check",
  "test",
  "test-integration",
]

[tasks]
up = "docker compose up -d postgres"
down = "docker compose down"
logs = "docker compose logs -f postgres"
db = "docker compose exec postgres psql -U saldo -d saldo"
run = "go run ./cmd/api"
test = "go test ./..."
check = "go vet ./..."