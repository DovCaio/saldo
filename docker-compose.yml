services:
  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://saldo:saldo@postgres:5432/saldo?sslmode=disable
    ports:
      - "8080:8080"
    networks:
      - saldo_network
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: saldo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saldo
      POSTGRES_USER: saldo
      POSTGRES_PASSWORD: saldo
    ports:
      - "5432:5432"
    volumes:
      - saldo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saldo -d saldo"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - saldo_network

  postgres_test:
    image: postgres:17
    container_name: saldo-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: saldo_test
      POSTGRES_USER: saldo_test
      POSTGRES_PASSWORD: saldo_test
    ports:
      - "5433:5432"
    volumes:
      - saldo_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saldo -d saldo"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  saldo_data:
  saldo_data_test:

networks:
  saldo_network:
